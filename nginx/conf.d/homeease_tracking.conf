# ==============================================================================
# HOME EASE – SINGLE-EC2 VIRTUAL HOST CONFIGURATION
# File: /etc/nginx/conf.d/homeease.conf
#
# All traffic arrives at this one EC2.  Nginx proxies internally to:
#   Spring Boot Core    → 127.0.0.1:8080  (bookings, auth, workers, dispatch)
#   Tracking Service    → 127.0.0.1:8082  (GPS ingestion, WebSocket, route)
#   Redis               → 127.0.0.1:6379  (never exposed externally)
#
# REMOVED (from previous multi-node configs):
#   × location_ingestion_upstream (multiple IPs)
#   × websocket_gateway_upstream  (multiple IPs)
#   × tracking_api_upstream       (multiple IPs)
#   × navigation_api_upstream     (multiple IPs)
#   × backend_core_upstream       (multiple IPs)
#   × google_routes_cache (proxy_cache_path – uses in-process LRU instead)
#   × enterprise 1M-connection settings
# ==============================================================================

# ── Upstreams (loopback – same EC2) ──────────────────────────────────────────
# keepalive: re-use connections to avoid TCP setup on every GPS update
upstream homeease_core {
    server 127.0.0.1:8080;
    keepalive 32;
}

upstream homeease_tracking {
    server 127.0.0.1:8082;
    keepalive 64;      # higher: GPS ingestion + WebSocket upgrade path
}

# ==============================================================================
# SERVER BLOCK 1: HTTP – ACME challenge + redirect to HTTPS
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name _;                # accept any hostname; tighten after DNS is set

    # Let's Encrypt HTTP-01 ACME challenge (certbot --webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Lightweight health check for external uptime monitors (no TLS required)
    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ==============================================================================
# SERVER BLOCK 2: HTTPS – main reverse proxy
# ==============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # ── TLS ───────────────────────────────────────────────────────────────────
    # Obtain with: certbot certonly --webroot -w /var/www/certbot -d <your-domain>
    # Then uncomment the two lines below and replace <your-domain>:
    # ssl_certificate         /etc/letsencrypt/live/<your-domain>/fullchain.pem;
    # ssl_certificate_key     /etc/letsencrypt/live/<your-domain>/privkey.pem;

    # Temporary self-signed cert for local/dev testing (generated by install script)
    ssl_certificate         /etc/nginx/ssl/homeease-selfsigned.crt;
    ssl_certificate_key     /etc/nginx/ssl/homeease-selfsigned.key;

    ssl_protocols           TLSv1.2 TLSv1.3;
    ssl_ciphers             ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384;
    ssl_prefer_server_ciphers off;

    # Session cache: 10 MB ≈ 40,000 sessions.  Reasonable for one EC2.
    ssl_session_cache       shared:SSL:10m;
    ssl_session_timeout     1d;
    ssl_session_tickets     off;

    # OCSP stapling – eliminates client CRL lookup
    # (Enable after using a real CA cert; remove for self-signed)
    # ssl_stapling            on;
    # ssl_stapling_verify     on;
    # resolver                8.8.8.8 8.8.4.4 valid=300s;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY"    always;
    add_header X-XSS-Protection          "1; mode=block" always;

    # ── Proxy defaults (applied to all locations) ─────────────────────────────
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ===========================================================================
    # LOCATION 1: Nginx-level health check (no backend dependency)
    # Used by external monitors / Route 53 health checks
    # ===========================================================================
    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # ===========================================================================
    # LOCATION 2: Spring Boot Actuator health (deep health check with Redis probe)
    # ===========================================================================
    location /api/v1/health {
        proxy_pass http://homeease_tracking;    # tracking service has the richer health endpoint
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout    5s;
        limit_req zone=api_limit burst=5 nodelay;
    }

    # ===========================================================================
    # LOCATION 3: STOMP over WebSocket (live tracking)
    # /ws, /ws/websocket, /ws/info  (SockJS negotiation paths)
    # ===========================================================================
    location /ws {
        proxy_pass http://homeease_tracking;

        # WebSocket upgrade
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Long-lived connections: mobile clients may be idle for many minutes
        proxy_connect_timeout  10s;
        proxy_send_timeout   3600s;
        proxy_read_timeout   3600s;

        # Real-time: disable response buffering
        proxy_buffering    off;
        proxy_cache        off;
        proxy_socket_keepalive on;
        chunked_transfer_encoding off;

        # No rate limit on the WebSocket handshake path itself;
        # GPS spam is throttled at the ingestion POST endpoint below.
        access_log /var/log/nginx/websocket.log main;
    }

    # ===========================================================================
    # LOCATION 4: Worker GPS Ingestion (high-frequency POST, throttled)
    # POST /api/v1/tracking/partner/location
    # POST /api/v1/tracking/update-location
    # ===========================================================================
    location ~* ^/api/v1/tracking/(partner/location|update-location)$ {
        limit_req zone=gps_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://homeease_tracking;
        proxy_set_header Connection "";

        # Short, strict timeouts: GPS must succeed fast or fail fast
        proxy_connect_timeout  2s;
        proxy_read_timeout     5s;
        proxy_send_timeout     5s;

        proxy_buffering          off;
        proxy_request_buffering  off;
    }

    # ===========================================================================
    # LOCATION 5: Tracking query APIs (latest location, distance, route)
    # GET /api/v1/tracking/latest/{id}
    # GET /api/v1/tracking/distance
    # GET /api/v1/tracking/route
    # GET /api/v1/tracking/directions
    # ===========================================================================
    location /api/v1/tracking/ {
        limit_req zone=api_limit burst=30 nodelay;

        proxy_pass http://homeease_tracking;
        proxy_set_header Connection "";

        proxy_connect_timeout  3s;
        proxy_read_timeout    10s;
        proxy_send_timeout    10s;
    }

    # ===========================================================================
    # LOCATION 6: Authentication endpoints – strict rate limiting
    # POST /api/v1/auth/login
    # POST /api/v1/auth/register
    # POST /api/v1/auth/otp-verify
    # ===========================================================================
    location ~* ^/api/v1/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://homeease_core;
        proxy_set_header Connection "";

        proxy_connect_timeout  5s;
        proxy_read_timeout    15s;
        proxy_send_timeout    15s;
    }

    # ===========================================================================
    # LOCATION 7: All other API traffic → Core Spring Boot backend (8080)
    # /api/v1/bookings, /api/v1/workers, /api/v1/admin, /api/v1/catalog …
    # ===========================================================================
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://homeease_core;
        proxy_set_header Connection "";

        proxy_connect_timeout  5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;

        # Buffer only for large paginated responses (catalog, admin listings)
        proxy_buffer_size       16k;
        proxy_buffers           8 16k;
        proxy_busy_buffers_size 32k;
    }

    # ===========================================================================
    # LOCATION 8: Default – 404 JSON (never fall through to directory listing)
    # ===========================================================================
    location / {
        default_type application/json;
        return 404 '{"error":"Not Found","status":404}';
    }
}
