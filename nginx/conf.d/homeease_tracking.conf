# ==============================================================================
# HOME EASE - UPSTREAM POOLS & VIRTUAL HOST CONFIGURATION
# Specialized Traffic Segregation across Microservices
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. UPSTREAM: Location Ingestion Gateways (High Write Throughput, 100k GPS/sec)
# ------------------------------------------------------------------------------
upstream location_ingestion_upstream {
    least_conn; # Distribute heavy ingestion evenly across nodes

    server 10.0.1.101:8082 max_fails=3 fail_timeout=5s;
    server 10.0.1.102:8082 max_fails=3 fail_timeout=5s;
    server 10.0.1.103:8082 max_fails=3 fail_timeout=5s;
    server 10.0.1.104:8082 max_fails=3 fail_timeout=5s;

    # Maintain persistent connection pool to upstreams to eliminate TCP handshake overhead
    keepalive 2048;
}

# ------------------------------------------------------------------------------
# 2. UPSTREAM: WebSocket Gateways (1,000,000 Concurrent Connections)
# ------------------------------------------------------------------------------
upstream websocket_gateway_upstream {
    # Hash on bookingId or remote IP to ensure connection affinity where beneficial
    hash $arg_bookingId consistent;

    server 10.0.2.101:8082 max_fails=3 fail_timeout=10s;
    server 10.0.2.102:8082 max_fails=3 fail_timeout=10s;
    server 10.0.2.103:8082 max_fails=3 fail_timeout=10s;
    server 10.0.2.104:8082 max_fails=3 fail_timeout=10s;
    server 10.0.2.105:8082 max_fails=3 fail_timeout=10s;
    server 10.0.2.106:8082 max_fails=3 fail_timeout=10s;

    keepalive 4096;
}

# ------------------------------------------------------------------------------
# 3. UPSTREAM: Tracking Query APIs (Latest Location & Distance Calculation)
# ------------------------------------------------------------------------------
upstream tracking_api_upstream {
    least_conn;

    server 10.0.3.101:8082 max_fails=3 fail_timeout=10s;
    server 10.0.3.102:8082 max_fails=3 fail_timeout=10s;

    keepalive 512;
}

# ------------------------------------------------------------------------------
# 4. UPSTREAM: Navigation & Route APIs (Google Routes & Directions)
# ------------------------------------------------------------------------------
upstream navigation_api_upstream {
    least_conn;

    server 10.0.4.101:8082 max_fails=3 fail_timeout=10s;
    server 10.0.4.102:8080 max_fails=3 fail_timeout=10s;

    keepalive 512;
}

# ------------------------------------------------------------------------------
# 5. UPSTREAM: Core Business Backend (Bookings, Auth, Admin, Dispatch Engine)
# ------------------------------------------------------------------------------
upstream backend_core_upstream {
    least_conn;

    server 10.0.5.101:8080 max_fails=3 fail_timeout=10s;
    server 10.0.5.102:8080 max_fails=3 fail_timeout=10s;

    keepalive 1024;
}

# ==============================================================================
# SERVER BLOCK: HTTP -> HTTPS Redirect
# ==============================================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name api.homeease.com tracking.homeease.com;

    # Allow ACME HTTP-01 challenge for Let's Encrypt / Certbot renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ==============================================================================
# SERVER BLOCK: PRIMARY HTTPS & WEBSOCKET LOAD BALANCER
# ==============================================================================
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name api.homeease.com tracking.homeease.com;

    # --------------------------------------------------------------------------
    # TLS / SSL Security Configuration
    # --------------------------------------------------------------------------
    ssl_certificate         /etc/ssl/certs/homeease.crt;
    ssl_certificate_key     /etc/ssl/private/homeease.key;
    ssl_protocols           TLSv1.2 TLSv1.3;
    ssl_ciphers             ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache       shared:SSL:100m; # Cache 400,000 sessions in RAM
    ssl_session_timeout     1d;
    ssl_session_tickets     off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Standard Proxy Headers
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # --------------------------------------------------------------------------
    # Health Check Endpoint (For Route 53 / External Monitoring)
    # --------------------------------------------------------------------------
    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # --------------------------------------------------------------------------
    # 1. Location Ingestion Gateway Endpoint (Worker GPS Updates)
    # POST /api/v1/tracking/partner/location, /api/v1/tracking/update-location
    # --------------------------------------------------------------------------
    location ~* ^/api/v1/tracking/(partner/location|update-location) {
        limit_req zone=gps_ingest_limit burst=30 nodelay;

        proxy_pass http://location_ingestion_upstream;
        proxy_set_header Connection "";
        
        # Zero buffering for real-time low latency
        proxy_buffering off;
        proxy_request_buffering off;

        proxy_connect_timeout 2s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
    }

    # --------------------------------------------------------------------------
    # 2. WebSocket Gateway (STOMP over WebSockets)
    # Handles 1,000,000 concurrent client connections
    # /ws, /ws/websocket, /ws/info
    # --------------------------------------------------------------------------
    location ~* ^/ws {
        proxy_pass http://websocket_gateway_upstream;

        # WebSocket Upgrade Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Extended timeouts: keep connection alive for 1 hour without timeout churn
        proxy_connect_timeout 7s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;

        # Disable buffering for instant message delivery
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # Enable TCP keepalive to dead connections detection
        proxy_socket_keepalive on;
    }

    # --------------------------------------------------------------------------
    # 3. Tracking Query APIs (Latest Location & Distance Calculation)
    # GET /api/v1/tracking/latest/{bookingId}, GET /api/v1/tracking/distance
    # --------------------------------------------------------------------------
    location ~* ^/api/v1/tracking/(latest|distance) {
        limit_req zone=api_general_limit burst=50 nodelay;

        proxy_pass http://tracking_api_upstream;
        proxy_set_header Connection "";

        proxy_connect_timeout 3s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
    }

    # --------------------------------------------------------------------------
    # 4. Navigation & Route Calculation APIs (Google Routes & Directions)
    # GET /api/v1/tracking/route, GET /api/v1/geo/directions
    # Caches road routes to prevent hammering Google Routes API every 5 seconds
    # --------------------------------------------------------------------------
    location ~* ^/api/v1/(tracking/route|geo/directions) {
        limit_req zone=api_general_limit burst=20 nodelay;

        proxy_pass http://navigation_api_upstream;
        proxy_set_header Connection "";

        # Route Caching (5 minute cache based on origin & destination lat/lng)
        proxy_cache google_routes_cache;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 5m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status;

        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    # --------------------------------------------------------------------------
    # 5. Core Business Backend APIs (Bookings, Auth, Admin, Workers)
    # /api/v1/bookings, /api/v1/auth, /api/v1/workers, /api/v1/admin
    # --------------------------------------------------------------------------
    location / {
        limit_req zone=api_general_limit burst=50 nodelay;

        proxy_pass http://backend_core_upstream;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
