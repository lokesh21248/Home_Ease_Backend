# ==============================================================================
# HOME EASE - INITIAL PRODUCTION NGINX CONFIGURATION
# Initial Capacity Target: 1,000 Concurrent Live Tracking Sessions (200 GPS req/s)
# Server Sizing: AWS t4g.small / t4g.medium instances (No AWS ALB required)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. UPSTREAM: Location Ingestion & Tracking Microservice (Port 8082)
# Handles 1,000 active tracking sessions (200 updates/sec at 5s interval)
# Scaled across 2 cost-effective app instances for high availability
# ------------------------------------------------------------------------------
upstream tracking_service_upstream {
    least_conn;

    # Primary Tracking Node (AZ-1a)
    server 10.0.1.10:8082 max_fails=3 fail_timeout=5s;
    # Secondary Tracking Node (AZ-1b) - Zero Single Point of Failure
    server 10.0.2.10:8082 max_fails=3 fail_timeout=5s;

    # Keepalive connection pool eliminates TCP handshakes on the hot path
    keepalive 256;
}

# ------------------------------------------------------------------------------
# 2. UPSTREAM: Core Spring Boot Monolith (Port 8080)
# Handles Bookings, Worker KYC, Dispatch Engine, Admin Calendar, Auth
# ------------------------------------------------------------------------------
upstream backend_core_upstream {
    least_conn;

    # Primary Core Backend (AZ-1a)
    server 10.0.1.20:8080 max_fails=3 fail_timeout=5s;
    # Secondary Core Backend (AZ-1b)
    server 10.0.2.20:8080 max_fails=3 fail_timeout=5s;

    keepalive 128;
}

# ==============================================================================
# SERVER BLOCK: HTTP -> HTTPS REDIRECT
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name api.homeease.com tracking.homeease.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ==============================================================================
# SERVER BLOCK: PRIMARY REVERSE PROXY & LOAD BALANCER
# ==============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.homeease.com tracking.homeease.com;

    # TLS / SSL Security
    ssl_certificate         /etc/ssl/certs/homeease.crt;
    ssl_certificate_key     /etc/ssl/private/homeease.key;
    ssl_protocols           TLSv1.2 TLSv1.3;
    ssl_ciphers             HIGH:!aNULL:!MD5;
    ssl_session_cache       shared:SSL:20m;
    ssl_session_timeout     1d;
    ssl_session_tickets     off;

    # Standard Proxy Headers
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # --------------------------------------------------------------------------
    # Health Check (Used by Route 53 / Uptime Kuma for Zero-Downtime Failover)
    # --------------------------------------------------------------------------
    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # --------------------------------------------------------------------------
    # 1. Real-Time WebSocket Endpoint (STOMP over WebSocket)
    # Serves 1,000 persistent customer/worker tracking connections
    # /ws, /ws/websocket, /ws/info
    # --------------------------------------------------------------------------
    location ~* ^/ws {
        proxy_pass http://tracking_service_upstream;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Keep WebSocket connection alive without dropping idle mobile clients
        proxy_connect_timeout 7s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_socket_keepalive on;
    }

    # --------------------------------------------------------------------------
    # 2. Worker GPS Location Ingestion
    # POST /api/v1/tracking/partner/location, POST /api/v1/tracking/update-location
    # --------------------------------------------------------------------------
    location ~* ^/api/v1/tracking/(partner/location|update-location) {
        limit_req zone=gps_ingest_limit burst=20 nodelay;

        proxy_pass http://tracking_service_upstream;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    # --------------------------------------------------------------------------
    # 3. Live Distance, Latest Location & Road Route
    # GET /api/v1/tracking/latest/{id}, GET /api/v1/tracking/distance, /route
    # --------------------------------------------------------------------------
    location ~* ^/api/v1/tracking/ {
        limit_req zone=api_general_limit burst=30 nodelay;

        proxy_pass http://tracking_service_upstream;
        proxy_set_header Connection "";

        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    # --------------------------------------------------------------------------
    # 4. Core Business Backend APIs (Port 8080)
    # /api/v1/bookings, /api/v1/workers, /api/v1/auth, /api/v1/admin
    # --------------------------------------------------------------------------
    location / {
        limit_req zone=api_general_limit burst=50 nodelay;

        proxy_pass http://backend_core_upstream;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
