# ==============================================================================
# HOME EASE - ENTERPRISE HIGH-CONCURRENCY NGINX CONFIGURATION
# Scale Target: 1,000,000 Concurrent WebSockets | 100,000 GPS Ingestions/sec
# Architecture: Direct External Ingress Load Balancer (No AWS ALB)
# ==============================================================================

user nginx;
pid /var/run/nginx.pid;

# 1 worker per CPU core (auto scales with EC2 instance size, e.g. c6in.8xlarge = 32 workers)
worker_processes auto;

# Must be higher than (worker_connections * worker_processes).
# Supported by Linux sysctl fs.file-max = 2097152
worker_rlimit_nofile 1048576;

# Bind worker processes to specific CPU cores for L1/L2/L3 cache affinity
worker_cpu_affinity auto;

events {
    # High-performance Linux I/O multiplexer
    use epoll;

    # Maximum simultaneous connections per worker process
    # 32 workers * 32,768 = 1,048,576 concurrent connections
    worker_connections 32768;

    # Accept as many connections as possible after notification
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --------------------------------------------------------------------------
    # High-Performance File & Socket Operations
    # --------------------------------------------------------------------------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # --------------------------------------------------------------------------
    # Connection Timeouts & Memory Optimization for 1M WebSockets
    # --------------------------------------------------------------------------
    # Keep idle client sockets open without premature termination
    keepalive_timeout 75s;
    keepalive_requests 100000;

    # Prevent slow-loris attacks while avoiding connection churn
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 20s;

    # Small client buffer to maximize memory efficiency across 1M sockets
    client_body_buffer_size 16k;
    client_header_buffer_size 2k;
    large_client_header_buffers 4 8k;
    client_max_body_size 10M;

    # --------------------------------------------------------------------------
    # WebSocket Upgrade Header Mapping
    # --------------------------------------------------------------------------
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # --------------------------------------------------------------------------
    # Logging Configuration (Async Buffering for 100k req/sec)
    # --------------------------------------------------------------------------
    log_format tracking_performance '$remote_addr - $remote_user [$time_local] '
                                    '"$request" $status $body_bytes_sent '
                                    'rt=$request_time uct="$upstream_connect_time" '
                                    'uht="$upstream_header_time" urt="$upstream_response_time" '
                                    'pipe=$pipe up="$upstream_addr"';

    # Buffered async disk writes prevent disk I/O bottlenecks during 100k GPS burst
    access_log /var/log/nginx/tracking_access.log tracking_performance buffer=128k flush=1s;
    error_log  /var/log/nginx/tracking_error.log warn;

    # --------------------------------------------------------------------------
    # Rate Limiting Zones (Token Bucket per IP / Worker)
    # --------------------------------------------------------------------------
    # General API limit: 100 requests/sec per IP (burst 200)
    limit_req_zone $binary_remote_addr zone=api_general_limit:50m rate=100r/s;

    # GPS Location Ingestion: High throughput zone supporting 100k updates/sec cluster-wide
    limit_req_zone $binary_remote_addr zone=gps_ingest_limit:100m rate=50r/s;

    # --------------------------------------------------------------------------
    # Google Routes & Geocoding Response Cache
    # --------------------------------------------------------------------------
    # Prevents hammering Google Routes API every 5 seconds for moving workers
    proxy_cache_path /var/cache/nginx/google_routes
                     levels=1:2
                     keys_zone=google_routes_cache:50m
                     max_size=2g
                     inactive=10m
                     use_temp_path=off;

    # Include upstream pools & server virtual hosts
    include /etc/nginx/conf.d/*.conf;
}
