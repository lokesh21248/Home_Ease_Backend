# ==============================================================================
# HOME EASE – CONSOLIDATED SINGLE-EC2 NGINX CONFIGURATION
# Architecture: Nginx + Spring Boot Core (8080) + Tracking Service (8082)
#               + Redis (127.0.0.1) all on ONE existing EC2 instance.
#
# Remove: separate Nginx EC2, AWS ALB, ElastiCache, Redis Cluster, Kafka,
#         multi-node upstream pools, enterprise 1M-connection settings.
#
# Target: 1,000 concurrent live-tracking sessions (200 GPS req/s)
# File:   /etc/nginx/nginx.conf
# Apply:  sudo nginx -t && sudo systemctl reload nginx
# ==============================================================================

user www-data;

# Auto-detect CPU cores.  For t3.small (2 vCPU) this is 2 workers.
worker_processes auto;

# 2 workers × 4096 connections = 8,192 total — more than enough for 1,000 sessions
# with overhead for reconnects + API traffic.
worker_rlimit_nofile 16384;

pid /run/nginx.pid;

events {
    use epoll;
    worker_connections 4096;
    multi_accept on;
}

http {
    # ── MIME and basics ───────────────────────────────────────────────────────
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;

    # ── Timeouts ──────────────────────────────────────────────────────────────
    # HTTP keep-alive: 65 s is the standard default.
    keepalive_timeout     65s;
    keepalive_requests    500;

    # Protect against slow-read / slow-write attacks
    client_body_timeout   15s;
    client_header_timeout 15s;
    send_timeout          20s;

    # ── Request-size limits ───────────────────────────────────────────────────
    # GPS payloads are tiny JSON objects (<1 KB). File uploads go through
    # the existing multipart endpoint (max 10 MB, set by Spring Boot).
    client_max_body_size    10m;
    client_body_buffer_size  16k;
    client_header_buffer_size 2k;
    large_client_header_buffers 4 8k;

    # ── Gzip compression ──────────────────────────────────────────────────────
    # Compress JSON API responses (reduces bandwidth for booking/catalog data)
    # Do NOT gzip WebSocket frames — they are already framed binary.
    gzip              on;
    gzip_min_length   512;
    gzip_comp_level   4;
    gzip_types        text/plain text/css application/json
                      application/javascript text/xml application/xml;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_disable      "msie6";

    # ── Hide server version ───────────────────────────────────────────────────
    server_tokens off;

    # ── WebSocket upgrade map ─────────────────────────────────────────────────
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── Rate limiting zones ───────────────────────────────────────────────────
    # Auth endpoints: strict – 5 req/s per IP, burst to 10
    limit_req_zone $binary_remote_addr zone=auth_limit:5m    rate=5r/s;

    # General API: 30 req/s per IP, burst to 60
    limit_req_zone $binary_remote_addr zone=api_limit:10m    rate=30r/s;

    # GPS ingestion: 10 req/s per IP (1 worker pings once per 5s = 0.2 r/s;
    # 10 r/s absorbs reconnect bursts from many workers behind one carrier NAT)
    limit_req_zone $binary_remote_addr zone=gps_limit:10m    rate=10r/s;

    # ── Logging ───────────────────────────────────────────────────────────────
    log_format main '$remote_addr [$time_local] "$request" '
                    '$status $body_bytes_sent '
                    'rt=$request_time urt=$upstream_response_time';

    # Buffer writes to avoid log I/O on the GPS hot path
    access_log /var/log/nginx/access.log  main buffer=32k flush=5s;
    error_log  /var/log/nginx/error.log   warn;

    # Rotate logs daily (logrotate handles this — see /etc/logrotate.d/nginx)

    # ── Include virtual hosts ─────────────────────────────────────────────────
    include /etc/nginx/conf.d/*.conf;
}
