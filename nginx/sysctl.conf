# ==============================================================================
# HOME EASE - LINUX KERNEL TUNING FOR 1,000,000 WEBSOCKET CONNECTIONS
# File: /etc/sysctl.d/99-homeease-tracking.conf
# Apply: sudo sysctl --system
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. File Descriptor Limits
# ------------------------------------------------------------------------------
# Allow the OS to allocate up to 2 million open file handles
fs.file-max = 2097152

# ------------------------------------------------------------------------------
# 2. Connection Backlog & Queues
# ------------------------------------------------------------------------------
# Maximum length of the listen queue for socket connections
net.core.somaxconn = 65535

# Maximum number of packets queued on the input side before being processed by CPU
net.core.netdev_max_backlog = 65535

# Maximum number of remembered connection requests without acknowledgment from client
net.ipv4.tcp_max_syn_backlog = 65535

# ------------------------------------------------------------------------------
# 3. Ephemeral Port Range & Connection Recycling
# ------------------------------------------------------------------------------
# Expand the port range for outgoing upstream proxy connections
net.ipv4.ip_local_port_range = 1024 65535

# Allow reuse of sockets in TIME_WAIT state for new connections (vital for upstream proxying)
net.ipv4.tcp_tw_reuse = 1

# Reduce TIME_WAIT duration from 60s to 15s to free closed sockets faster
net.ipv4.tcp_fin_timeout = 15

# Maximum number of sockets in TIME_WAIT state
net.ipv4.tcp_max_tw_buckets = 1440000

# ------------------------------------------------------------------------------
# 4. Memory & TCP Buffer Tuning (CRITICAL FOR 1M CONNECTIONS)
# Tuning buffer to 4KB min, 4KB default, 16KB max per connection
# Result: 1,000,000 connections * 8KB = ~8 GB RAM total (instead of 87 GB default)
# ------------------------------------------------------------------------------
net.ipv4.tcp_rmem = 4096 4096 16384
net.ipv4.tcp_wmem = 4096 4096 16384

# Allocate ample TCP buffer memory pages (min, pressure, max in 4KB pages)
net.ipv4.tcp_mem = 786432 1048576 1572864

# Disable TCP slow start after idle to maintain fast response times
net.ipv4.tcp_slow_start_after_idle = 0

# Enable TCP BBR congestion control for lowest latency across cellular networks
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# Keepalive intervals: detect dead mobile connections within 60s
net.ipv4.tcp_keepalive_time = 60
net.ipv4.tcp_keepalive_intvl = 10
net.ipv4.tcp_keepalive_probes = 5
