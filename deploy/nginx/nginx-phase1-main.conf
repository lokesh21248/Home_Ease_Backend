# ==============================================================================
# HOME EASE – PHASE 1 NGINX MAIN CONFIG
# File: /etc/nginx/nginx.conf
# Apply: sudo nginx -t && sudo systemctl reload nginx
# ==============================================================================

user nginx;

# 2 worker processes are sufficient for a t4g.small / t4g.medium with 2 cores.
# Set to "auto" if the instance has more cores.
worker_processes 2;

# Max open files per worker: matches kernel ulimit
worker_rlimit_nofile 65536;

pid /run/nginx.pid;

events {
    # 2048 × 2 workers = 4,096 total simultaneous connections
    # Comfortably handles 1,000 WebSocket connections + API traffic overhead
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    # ── MIME Types ───────────────────────────────────────────────────────────
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────────────────
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time '
                      'upstream_rt=$upstream_response_time';

    access_log  /var/log/nginx/access.log  main buffer=64k flush=5s;
    error_log   /var/log/nginx/error.log   warn;

    # ── Performance ──────────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off;

    # ── Gzip Compression ─────────────────────────────────────────────────────
    gzip on;
    gzip_comp_level 4;
    gzip_min_length 1024;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_proxied any;
    gzip_vary on;

    # ── WebSocket Upgrade Map ─────────────────────────────────────────────────
    # Correctly maps "Upgrade" header for WebSocket proxying
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── Rate Limiting Zones ───────────────────────────────────────────────────
    # GPS ingestion: 10 req/s per worker IP (burst to 20 for immediate movement spikes)
    # 1,000 workers × 1 update/5s = 200 req/s cluster-wide; per-worker: 1 req/5s = 0.2 r/s.
    # We allow 10 r/s per IP to accommodate reconnect bursts after mobile handoffs.
    limit_req_zone $binary_remote_addr zone=gps_ingest_zone:10m rate=10r/s;

    # General API limit: 50 req/s per IP for auth, booking, admin endpoints
    limit_req_zone $binary_remote_addr zone=api_general_zone:10m rate=50r/s;

    # ── Size Limits ───────────────────────────────────────────────────────────
    # GPS location payloads are small JSON objects; reject oversized uploads
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;

    # ── Proxy Defaults ────────────────────────────────────────────────────────
    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;
    proxy_send_timeout    30s;
    proxy_buffering off;
    proxy_buffer_size 16k;
    proxy_busy_buffers_size 32k;

    # Pass real client IP to backend
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # ── Include Virtual Hosts ─────────────────────────────────────────────────
    include /etc/nginx/conf.d/*.conf;
}

