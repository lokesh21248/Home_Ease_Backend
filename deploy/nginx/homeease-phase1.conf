# ==============================================================================
# HOME EASE – PHASE 1 NGINX VIRTUAL HOST
# File: /etc/nginx/conf.d/homeease.conf
# This file is included by nginx-phase1-main.conf
#
# TOPOLOGY (Option B – single backend EC2, Redis co-located):
#
#   [Mobile Apps]
#        │
#   [Route 53 DNS Failover]
#        │
#   ┌─────────────┐  ┌─────────────┐
#   │ Nginx LB 1  │  │ Nginx LB 2  │   ← Two t4g.small in separate AZs
#   │  AZ-1a      │  │  AZ-1b      │
#   └──────┬──────┘  └──────┬──────┘
#          └────────┬────────┘
#                   │  (single backend for now)
#         ┌─────────▼──────────┐
#         │  Backend EC2       │  ← Existing Spring Boot EC2
#         │  Port 8080: Core   │
#         │  Port 8082: Track  │
#         │  Port 6379: Redis  │  ← Redis co-located (localhost only)
#         └────────────────────┘
# ==============================================================================

# ── UPSTREAM: Tracking Microservice (Port 8082) ────────────────────────────────
# Single backend EC2 for Phase 1; add second server line when you add an EC2.
upstream tracking_service_upstream {
    # Phase 1: single node
    server 10.0.1.20:8082 max_fails=3 fail_timeout=10s;
    # Phase 2: uncomment when second backend EC2 is provisioned
    # server 10.0.2.20:8082 max_fails=3 fail_timeout=10s;

    keepalive 128;
}

# ── UPSTREAM: Core Spring Boot Backend (Port 8080) ────────────────────────────
upstream backend_core_upstream {
    server 10.0.1.20:8080 max_fails=3 fail_timeout=10s;
    # server 10.0.2.20:8080 max_fails=3 fail_timeout=10s;

    keepalive 64;
}

# ==============================================================================
# SERVER BLOCK: HTTP → HTTPS REDIRECT
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name api.homeease.com tracking.homeease.com;

    # Let's Encrypt / Certbot ACME HTTP-01 challenge renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Health check for Route 53 DNS failover (HTTP, no TLS required)
    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ==============================================================================
# SERVER BLOCK: HTTPS REVERSE PROXY
# ==============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.homeease.com tracking.homeease.com;

    # ── TLS ─────────────────────────────────────────────────────────────────
    # Obtain certificates with:
    #   certbot --nginx -d api.homeease.com -d tracking.homeease.com
    ssl_certificate         /etc/letsencrypt/live/api.homeease.com/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/api.homeease.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/api.homeease.com/chain.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384;
    ssl_prefer_server_ciphers off;

    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling – eliminates client-side CRL lookup round trip
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout    5s;

    # HSTS – tell browsers to only use HTTPS for 1 year
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Security Headers ─────────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ── Proxy Headers (applied to all locations) ─────────────────────────────
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # ── 1. Nginx health check endpoint ───────────────────────────────────────
    # Used by AWS Route 53 health checks for DNS-based failover.
    # Must be fast (no backend dependency).
    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # ── 2. Spring Boot Actuator health (proxied for deep health check) ────────
    location /actuator/health {
        proxy_pass http://backend_core_upstream;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        limit_req zone=api_general_zone burst=5 nodelay;
    }

    # ── 3. STOMP over WebSocket ───────────────────────────────────────────────
    # Handles persistent 1,000 WebSocket connections for live tracking.
    # /ws, /ws/websocket, /ws/info (SockJS negotiation)
    location ~* ^/ws {
        proxy_pass http://tracking_service_upstream;

        # WebSocket upgrade headers (uses the map defined in nginx.conf)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Long-lived connections: mobile apps may idle for minutes
        proxy_connect_timeout 7s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;

        # Disable buffering for real-time frames
        proxy_buffering off;
        proxy_cache     off;
        chunked_transfer_encoding off;
        proxy_socket_keepalive on;

        # No rate limit on WebSocket handshake path; limit on GPS ingestion POST
        access_log /var/log/nginx/websocket.log main;
    }

    # ── 4. Worker GPS Location Ingestion (high-frequency POST) ───────────────
    # POST /api/v1/tracking/partner/location
    # POST /api/v1/tracking/update-location
    # Throttled: 10 r/s per worker IP, burst 20
    location ~* ^/api/v1/tracking/(partner/location|update-location) {
        limit_req zone=gps_ingest_zone burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://tracking_service_upstream;
        proxy_set_header Connection "";

        # Short timeouts: GPS ingestion must be fast or fail fast
        proxy_connect_timeout 2s;
        proxy_read_timeout    5s;
        proxy_send_timeout    5s;

        proxy_buffering          off;
        proxy_request_buffering  off;
    }

    # ── 5. Tracking API (latest location, distance, route) ───────────────────
    # GET /api/v1/tracking/latest/{id}
    # GET /api/v1/tracking/distance
    # GET /api/v1/tracking/route | /directions
    location ~* ^/api/v1/tracking/ {
        limit_req zone=api_general_zone burst=30 nodelay;

        proxy_pass http://tracking_service_upstream;
        proxy_set_header Connection "";

        proxy_connect_timeout 3s;
        proxy_read_timeout    10s;
    }

    # ── 6. Core Business APIs ─────────────────────────────────────────────────
    # /api/v1/bookings, /api/v1/workers, /api/v1/auth, /api/v1/admin
    # Routing to Core Spring Boot monolith (Port 8080)
    location /api/ {
        limit_req zone=api_general_zone burst=50 nodelay;

        proxy_pass http://backend_core_upstream;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # ── 7. Default fallback ───────────────────────────────────────────────────
    location / {
        return 404 '{"error":"Not Found"}';
        default_type application/json;
    }
}

