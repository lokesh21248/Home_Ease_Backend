# ==============================================================================
# HOME EASE – AWS Route 53 DNS Failover Configuration Guide
# Phase 1: Two Nginx EC2 Nodes (No AWS ALB)
# ==============================================================================
#
# TOPOLOGY
# ─────────────────────────────────────────────────────────────────────────────
# [Mobile Apps]
#      │
#      ▼
# [Route 53] ──► Health Check on Nginx-AZ1a /healthz
#   │  └──────► Health Check on Nginx-AZ1b /healthz
#   │
#   ├─► Nginx Node 1 (AZ-1a)  10.0.1.5  EIP: 1.2.3.4   (PRIMARY)
#   └─► Nginx Node 2 (AZ-1b)  10.0.2.5  EIP: 5.6.7.8   (SECONDARY / FAILOVER)
#          │
#          └──► Backend EC2  10.0.1.20  Port 8080 (Core) + Port 8082 (Tracking)
#                            └──► Redis 127.0.0.1:6379 (co-located)
#                            └──► Supabase PostgreSQL (external managed)
# ─────────────────────────────────────────────────────────────────────────────

# ==============================================================================
# STEP 1: Create Route 53 Health Checks
# ==============================================================================
# In AWS Console → Route 53 → Health Checks → Create:
#
# Health Check 1 (Nginx AZ-1a):
#   Name: homeease-nginx-az1a
#   Protocol: HTTPS
#   FQDN: api.homeease.com
#   IP Address: <Nginx AZ-1a Elastic IP>
#   Port: 443
#   Path: /healthz
#   Failure Threshold: 2 consecutive failures
#   Request Interval: 30 seconds
#
# Health Check 2 (Nginx AZ-1b):
#   Name: homeease-nginx-az1b
#   (same settings, different IP: Nginx AZ-1b Elastic IP)

# ==============================================================================
# STEP 2: Create Route 53 Weighted Records (Active-Active Split 50/50)
# ==============================================================================
# AWS Console → Route 53 → Hosted Zones → homeease.com → Create Record:
#
# Record 1 (AZ-1a):
#   Name:           api.homeease.com
#   Type:           A
#   Value:          <Nginx AZ-1a Elastic IP>
#   TTL:            60
#   Routing Policy: Weighted
#   Weight:         50
#   Set ID:         nginx-az1a
#   Health Check:   homeease-nginx-az1a
#
# Record 2 (AZ-1b):
#   Name:           api.homeease.com
#   Type:           A
#   Value:          <Nginx AZ-1b Elastic IP>
#   TTL:            60
#   Routing Policy: Weighted
#   Weight:         50
#   Set ID:         nginx-az1b
#   Health Check:   homeease-nginx-az1b
#
# When AZ-1a fails health check, Route 53 removes it.
# All traffic flows to AZ-1b within one TTL (60 seconds).
# WebSocket clients automatically reconnect with 2s backoff (implemented in useLiveTracking.ts).

# ==============================================================================
# STEP 3: Repeat for tracking.homeease.com (or use CNAME → api.homeease.com)
# ==============================================================================
# tracking.homeease.com CNAME → api.homeease.com   (simpler; same Nginx handles both)

# ==============================================================================
# STEP 4: Security Group Rules
# ==============================================================================
# Nginx EC2 Security Group (apply to BOTH Nginx nodes):
#   Inbound:
#     HTTP  80   from 0.0.0.0/0  (ACME challenge + redirect)
#     HTTPS 443  from 0.0.0.0/0  (Mobile apps)
#     TCP   22   from <your-ip>/32  (SSH – restrict to your IP only)
#
# Backend EC2 Security Group:
#   Inbound:
#     TCP   8080  from Nginx-SG  (Core API)
#     TCP   8082  from Nginx-SG  (Tracking API + WebSocket)
#     TCP   22    from <your-ip>/32
#     (NO port 6379 open to any source – Redis is 127.0.0.1 only)

# ==============================================================================
# STEP 5: Elastic IPs
# ==============================================================================
# Allocate two Elastic IPs from AWS Console → EC2 → Elastic IPs → Allocate.
# Associate:
#   EIP-1 → Nginx Node 1 EC2 instance
#   EIP-2 → Nginx Node 2 EC2 instance
#
# Update Route 53 A records with the allocated EIP addresses.

# ==============================================================================
# STEP 6: WebSocket Reconnect Strategy
# ==============================================================================
# useLiveTracking.ts already implements:
#   - reconnectDelay: 2000ms (2 second backoff)
#   - Snapshot fetch on reconnect: GET /api/v1/tracking/latest/{bookingId}
#   - Stale signal detection: >15s without GPS update → "Reconnecting..." status
#
# No WebSocket sticky sessions needed: each reconnect fetches the latest snapshot
# from Redis (shared state between both Nginx nodes → same backend EC2).

# ==============================================================================
# PHASE 2 UPGRADE PATH (when needed)
# ==============================================================================
# When adding a second backend EC2:
#   1. Add backend_core_upstream and tracking_service_upstream second server line
#      in homeease-phase1.conf (already commented as placeholder).
#   2. Enable least_conn; directive (already present).
#   3. Migrate Redis to ElastiCache (change REDIS_HOST in tracking.env).
#   4. Set TRACKING_KAFKA_ENABLED=true when sessions > 10,000.
