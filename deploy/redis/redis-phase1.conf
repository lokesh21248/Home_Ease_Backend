# ==============================================================================
# HOME EASE – PHASE 1 REDIS CONFIGURATION
# Install location: /etc/redis/redis.conf   (on backend EC2)
# Apply:            sudo systemctl restart redis
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. NETWORK BINDING – NEVER EXPOSE PORT 6379 PUBLICLY
# ------------------------------------------------------------------------------
# Bind to localhost AND the backend EC2 private IP only.
# Replace 10.0.1.20 with your actual private EC2 IP from `ip addr`.
# The tracking service on the SAME EC2 connects via 127.0.0.1.
bind 127.0.0.1 10.0.1.20

# Reject any connection from outside the bind interfaces
protected-mode yes

# Standard Redis port
port 6379

# UNIX socket for ultra-low-latency local connections (optional but fast)
# unixsocket /var/run/redis/redis.sock
# unixsocketperm 770

# TCP backlog for concurrent connection bursts (match kernel somaxconn)
tcp-backlog 511

# Idle TCP keepalive interval in seconds
tcp-keepalive 300

# ------------------------------------------------------------------------------
# 2. AUTHENTICATION
# ------------------------------------------------------------------------------
# REQUIRED: Set a strong password before first production start.
# Replace <REDIS_PASSWORD> with the value you will use in REDIS_PASSWORD env var.
# Generate: openssl rand -base64 32
requirepass <REDIS_PASSWORD>

# Rename dangerous commands to empty string to disable them in production
rename-command FLUSHALL   ""
rename-command FLUSHDB    ""
rename-command DEBUG      ""
rename-command CONFIG     "homeease-config-9x3"
rename-command SHUTDOWN   "homeease-shutdown-7z2"

# ------------------------------------------------------------------------------
# 3. MEMORY – 20% OF EC2 RAM RESERVED FOR TRACKING CACHE
# ------------------------------------------------------------------------------
# t4g.small  = 2 GB  RAM → 20% = 400 MB
# t4g.medium = 4 GB  RAM → 20% = 800 MB
# Adjust to your actual instance type:
maxmemory 400mb

# Eviction policy: when maxmemory is reached, evict keys with TTL
# (tracking:booking:* all have TTL 2h so they are safe candidates)
maxmemory-policy allkeys-lru

# Warn when memory approaches 90% of maxmemory
# (checked by RedisHealthIndicator in Spring Boot actuator)

# ------------------------------------------------------------------------------
# 4. PERSISTENCE – AOF (Append Only File) for Crash Recovery
# ------------------------------------------------------------------------------
# RDB snapshots: lightweight periodic full snapshots
save 900 1
save 300 10
save 60  1000

# AOF: durability with every-second fsync
appendonly yes
appendfilename "redis-homeease.aof"

# fsync policy: "everysec" = at most 1 second of data loss on crash
# "always" is safest but kills throughput; "everysec" is the right balance
appendfsync everysec

# Do not stall writes during BGSAVE / BGREWRITEAOF
no-appendfsync-on-rewrite no

# Rewrite AOF when it grows 100% larger than the last rewrite
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB file location
dir /var/lib/redis
dbfilename dump-homeease.rdb

# ------------------------------------------------------------------------------
# 5. REPLICATION – FUTURE UPGRADE PATH
# ------------------------------------------------------------------------------
# Uncomment and configure when adding a Redis replica for read scaling.
# replicaof <PRIMARY_PRIVATE_IP> 6379
# masterauth <REDIS_PASSWORD>
# replica-read-only yes

# ------------------------------------------------------------------------------
# 6. PERFORMANCE TUNING
# ------------------------------------------------------------------------------
# TCP socket send buffer size (0 = OS default)
# Disables Nagle algorithm for lower latency on small GPS payloads
tcp-nodelay yes

# Lazy freeing: free memory in background thread on DEL / EXPIRE
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# Hash and list entry compression thresholds
hash-max-listpack-entries 128
hash-max-listpack-value 64
list-max-listpack-size -2

# Disable Transparent Huge Pages warning (must also disable at OS level)
# activedefrag yes

# ------------------------------------------------------------------------------
# 7. SLOW LOG – DETECT LATENCY SPIKES
# ------------------------------------------------------------------------------
# Log any command taking longer than 10ms
slowlog-log-slower-than 10000
slowlog-max-len 256

# Latency monitoring – track commands slower than 25ms
latency-monitor-threshold 25
latency-tracking yes

# ------------------------------------------------------------------------------
# 8. KEYSPACE NOTIFICATIONS – FOR SPRING BOOT TTL EXPIRY EVENTS (OPTIONAL)
# ------------------------------------------------------------------------------
# Uncomment to receive __keyevent@*__:expired events for cleanup hooks
# notify-keyspace-events "Ex"

# ------------------------------------------------------------------------------
# 9. LOGGING
# ------------------------------------------------------------------------------
loglevel notice
logfile /var/log/redis/redis-server.log

# ------------------------------------------------------------------------------
# 10. MAX CLIENTS
# ------------------------------------------------------------------------------
# 1,000 tracking sessions × 2 connections (ingestion + tracking read) + overhead
maxclients 4096

# Timeout for idle client connections (seconds); 0 = never
timeout 0
