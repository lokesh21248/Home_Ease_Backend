name: Deploy HomeEase to AWS EC2

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    name: Build & Deploy to AWS EC2
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST || secrets.EC2_HOST }}
          username: ${{ secrets.SSH_USERNAME || secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY || secrets.EC2_SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            if [ -d ~/Home_Ease_Backend ]; then
              cd ~/Home_Ease_Backend
            elif [ -d ~/firstdoor ]; then
              cd ~/firstdoor
            fi
            git remote set-url origin https://github.com/lokesh21248/Home_Ease_Backend.git 2>/dev/null || true
            echo "📥 Pulling latest changes from GitHub (Home_Ease_Backend)..."
            git pull origin main

            echo "📦 Building Core Backend JAR..."
            mvn clean package -DskipTests

            echo "📦 Building Dispatch Microservice JAR..."
            cd homeease-dispatch-service && mvn clean package -DskipTests && cd ..

            echo "📦 Building Tracking Microservice JAR..."
            cd homeease-tracking-service && mvn clean package -DskipTests && cd ..

            echo "📦 Building Notification Microservice JAR..."
            cd homeease-notification-service && mvn clean package -DskipTests && cd ..

            echo "🐳 Rebuilding and restarting all Docker containers..."
            docker compose up -d --build
            echo "✅ Deployment successful! Running containers:"
            docker ps
