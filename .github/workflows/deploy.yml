name: Deploy HomeEase to AWS EC2

on:
  push:
    branches: [ "main" ]

jobs:
  # Tests must pass before anything is deployed (previously every push to main deployed with -DskipTests).
  ci:
    name: Tests
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Build & Deploy to AWS EC2
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST || secrets.EC2_HOST }}
          username: ${{ secrets.SSH_USERNAME || secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY || secrets.EC2_SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            echo "📥 Navigating to project directory..."
            if [ -d ~/Home_Ease_Backend ]; then
              cd ~/Home_Ease_Backend
            elif [ -d ~/firstdoor ]; then
              cd ~/firstdoor
            fi
            git remote set-url origin https://github.com/lokesh21248/Home_Ease_Backend.git 2>/dev/null || true
            echo "📥 Syncing latest changes from GitHub (Home_Ease_Backend)..."
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            echo "🔎 Pre-flight: the new build REQUIRES DB_USER/DB_PASS (or SPRING_DATASOURCE_*) and JWT_SECRET..."
            echo "   If a variable is missing this step fails BEFORE anything is built, copied or restarted,"
            echo "   so the running services stay up. Set the variables in the services' EnvironmentFile and redeploy."
            bash deploy/preflight-env.sh homeease-core:core homeease-tracking:tracking

            echo "📦 Building Core Backend JAR..."
            mvn clean package -DskipTests

            echo "📦 Building Tracking Microservice JAR..."
            cd homeease-tracking-service && mvn clean package -DskipTests && cd ..

            echo "🚀 Installing JARs to /opt/homeease..."
            sudo cp target/homeease-backend-1.0.0-SNAPSHOT.jar /opt/homeease/core/homeease-backend.jar
            sudo cp homeease-tracking-service/target/homeease-tracking-service-1.0.0-SNAPSHOT.jar /opt/homeease/tracking/homeease-tracking-service.jar
            sudo chown -R homeease:homeease /opt/homeease

            echo "🔄 Restarting Systemd Services..."
            sudo systemctl restart homeease-core homeease-tracking
            sudo systemctl is-active homeease-core homeease-tracking
            echo "✅ Deployment successful! All services running."
