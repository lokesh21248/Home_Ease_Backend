server:
  port: 8081

spring:
  application:
    name: homeease-dispatch-service

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

homeease:
  dispatch:
    radius-meters: 5000
    response-timeout-seconds: 180

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
