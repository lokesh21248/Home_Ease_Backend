server:
  port: 8081

spring:
  application:
    name: homeease-dispatch-service

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # REDIS_URL (rediss://default:<password>@host:6379) is mapped to spring.data.redis.url by
      # RedisUrlEnvironmentPostProcessor and overrides host/port/password; rediss:// enables TLS.
      timeout: ${REDIS_COMMAND_TIMEOUT:2000ms}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:5000ms}

homeease:
  worker:
    presence:
      # Same switch as the core backend: a GEO candidate counts only while worker:heartbeat:<id> exists.
      enforce: ${WORKER_PRESENCE_ENFORCE:false}
  dispatch:
    radius-meters: 5000
    response-timeout-seconds: 180

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
