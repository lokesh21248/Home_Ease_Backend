# HomeEase Production Nginx Configuration
# Compliant with Sections 14-22 of System Design
# Reverse Proxy, Load Balancer, SSL/TLS, WebSocket Upgrades & Cloudflare Real-IP

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 8192;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging with Cloudflare IP restoration
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Cloudflare Real-IP Restoration
    # When behind Cloudflare, extract actual client IP from CF-Connecting-IP
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;

    # Rate Limiting Zones (Section 14)
    # OTP rate limiting: 5 requests per minute per IP
    limit_req_zone $binary_remote_addr zone=otp_limit:10m rate=5r/m;
    # General API rate limiting: 120 requests per minute per IP
    limit_req_zone $binary_remote_addr zone=api_limit:20m rate=120r/m;
    # WebSocket connection limit: 20 per IP
    limit_conn_zone $binary_remote_addr zone=ws_conn_limit:10m;

    # Upstream Stateless Spring Boot API Cluster (Section 14 & 17)
    upstream spring_boot_api {
        least_conn;
        server api:8080 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    # WebSocket Upgrade Mapping
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # HTTP redirect to HTTPS
    server {
        listen 80;
        server_name api.homeease.in ops.homeease.in _;
        return 301 https://$host$request_uri;
    }

    # Main HTTPS Server
    server {
        listen 443 ssl http2;
        server_name api.homeease.in ops.homeease.in _;

        # SSL Configuration
        ssl_certificate /etc/nginx/ssl/live/homeease.crt;
        ssl_certificate_key /etc/nginx/ssl/live/homeease.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security Headers (Section 14 WAF / OWASP)
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        client_max_body_size 25M;

        # Healthcheck endpoint (Unthrottled for AWS ALB / monitoring)
        location /actuator/health {
            proxy_pass http://spring_boot_api/actuator/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            access_log off;
        }

        # Auth & OTP Endpoints (Strict Rate Limiting)
        location /api/v1/auth/otp {
            limit_req zone=otp_limit burst=3 nodelay;

            proxy_pass http://spring_boot_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
        }

        # WebSocket Streaming: Worker Live GPS Telemetry & Offer STOMP Channel
        # Replaces dedicated gateway with Spring WebSocket behind Nginx (Section 14 & 18)
        location ~ ^/(worker|customer)/stream {
            limit_conn ws_conn_limit 10;

            proxy_pass http://spring_boot_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Extended timeouts for persistent WebSocket stream
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 10s;

            # Disable buffering for live telemetry streaming
            proxy_buffering off;
        }

        # General REST API Endpoints
        location / {
            limit_req zone=api_limit burst=30 nodelay;

            proxy_pass http://spring_boot_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }
    }
}

