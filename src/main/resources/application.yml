server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: homeease-backend

  jackson:
    serialization:
      fail-on-empty-beans: false


  datasource:
    url: jdbc:postgresql://${DB_HOST:aws-0-ap-south-1.pooler.supabase.com}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require&stringtype=unspecified&prepareThreshold=0
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50


  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration/postgresql

  data:
    redis:
      # If the REDIS_URL environment variable is set (e.g. rediss://default:<password>@host:6379),
      # RedisUrlEnvironmentPostProcessor maps it to spring.data.redis.url, which overrides
      # host/port/password below. The "rediss://" scheme enables TLS. Never hard-code the password.
      # (An empty spring.data.redis.url is rejected by Spring Boot, so it is not declared here.)
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_COMMAND_TIMEOUT:2000ms}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:5000ms}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: RECORD
      auto-startup: ${KAFKA_LISTENER_AUTO_STARTUP:false}

# Supabase Storage (S3-compatible) Configuration
supabase:
  storage:
    endpoint: ${SUPABASE_STORAGE_ENDPOINT:https://gheiuyygjssqatziviix.storage.supabase.co/storage/v1/s3}
    region: ${SUPABASE_REGION:ap-south-1}
    access-key: ${SUPABASE_S3_ACCESS_KEY:your-access-key}
    secret-key: ${SUPABASE_S3_SECRET_KEY:your-secret-key}
    public-url: ${SUPABASE_PUBLIC_URL:https://gheiuyygjssqatziviix.supabase.co/storage/v1/object/public}
    buckets:
      services: homeease-services
      sub-services: homeease-sub-services
      banners: homeease-banners
      worker-kyc: homeease-worker-kyc
      worker-profile: homeease-worker-profile

# App Configuration
homeease:
  # Protection for the PUBLIC (unauthenticated) nearby-workers preview: each uncached call costs ~12 Redis commands
  # plus DB queries. 0 disables the respective protection.
  public-api:
    nearby-workers:
      per-client-per-minute: ${NEARBY_WORKERS_RATE_PER_CLIENT:60}   # keyed by CF-Connecting-IP / X-Real-IP / socket
      global-per-minute: ${NEARBY_WORKERS_RATE_GLOBAL:1200}         # all callers together; holds against forged headers
      cache-seconds: ${NEARBY_WORKERS_CACHE_SECONDS:10}             # share results within a ~11 m cell for N seconds
  firebase:
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:classpath:firebase-service-account.json}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  dispatch:
    radius-meters: 5000 # 5 km matching radius
    response-timeout-seconds: 180 # 3 minutes timeout for candidate acceptance
    worker-accept-guard:
      enabled: ${WORKER_ACCEPT_GUARD_ENABLED:false} # OPT-IN: one in-flight instant job per worker; off = previous behaviour
    # Safety net for the booking -> dispatch hand-off (InstantDispatchRecoveryJob). A booking is committed first and
    # dispatched afterwards; if the process stops in between, or the dispatch transaction fails, the booking stays
    # REQUESTED with no offers. This job re-dispatches exactly those (instant, REQUESTED, zero assignment rows),
    # within an age window so old bookings are never resurrected. Set DISPATCH_RECOVERY_ENABLED=false to switch it off.
    recovery:
      enabled: ${DISPATCH_RECOVERY_ENABLED:true}
      interval-ms: 30000
      initial-delay-ms: 60000
      min-age-seconds: 45     # younger bookings are still being dispatched normally
      max-age-minutes: 15     # older ones are left alone (use POST /bookings/{id}/retry-dispatch for those)
      batch-size: 20
  billing:
    platform-commission-percent: 2.00 # 2% platform commission
  worker:
    auto-verify: ${AUTO_VERIFY_WORKERS:true} # Workers require admin approval via /admin/workers/{id}/verify-kyc
    # Worker presence / heartbeat policy (single source of truth; see HOME_EASE_WORKER_HEARTBEAT_AUDIT.md)
    presence:
      heartbeat-interval-seconds: ${WORKER_HEARTBEAT_INTERVAL_SECONDS:15}  # client ping cadence; job-time GPS refresh throttle
      heartbeat-ttl-seconds: ${WORKER_HEARTBEAT_TTL_SECONDS:60}            # key TTL == stale-worker threshold (must be >= 3 x interval)
      enforce: ${WORKER_PRESENCE_ENFORCE:false}                            # OPT-IN: true = dispatch requires a live heartbeat; enable only after the worker app's ping cadence is confirmed
      sweep-interval-seconds: ${WORKER_PRESENCE_SWEEP_SECONDS:900}         # stale GEO member cleanup (hygiene only), 0 = off
      sweep-zone-sets: ${WORKER_PRESENCE_SWEEP_ZONES:false}               # also sweep geo:workers:<zone> sets (adds commands per pincode)
      stationary:                  # OFF by default: heartbeat-only SET (1 command instead of 7) for workers who have not moved
        enabled: ${WORKER_PING_STATIONARY_ENABLED:false}
        max-move-meters: ${WORKER_PING_STATIONARY_METERS:25}
        full-refresh-seconds: ${WORKER_PING_STATIONARY_FULL_REFRESH_SECONDS:120}
  google:
    maps:
      api-key: ${GOOGLE_MAPS_API_KEY:}
  # Road routing for GET /api/v1/tracking/{bookingId}/route (Google Routes API computeRoutes).
  # The credential lives ONLY in backend environment configuration and is never sent to mobile clients.
  # Use a dedicated key: restrict it to the Routes API and to this server's egress IP. The Maps SDK key shipped
  # inside the mobile apps must be a different key. GOOGLE_MAPS_API_KEY is accepted as a fallback.
  routes:
    google:
      api-key: ${GOOGLE_ROUTES_API_KEY:${GOOGLE_MAPS_API_KEY:}}
      base-url: ${GOOGLE_ROUTES_BASE_URL:https://routes.googleapis.com}
      travel-mode: ${GOOGLE_ROUTES_TRAVEL_MODE:DRIVE}
      routing-preference: ${GOOGLE_ROUTES_ROUTING_PREFERENCE:TRAFFIC_AWARE}
      connect-timeout-ms: ${GOOGLE_ROUTES_CONNECT_TIMEOUT_MS:2000}
      read-timeout-ms: ${GOOGLE_ROUTES_READ_TIMEOUT_MS:5000}
    # Paid-API cost controls (per booking, however often clients call):
    min-interval-seconds: ${ROUTES_MIN_INTERVAL_SECONDS:20}                  # cached route is served inside this window
    off-route-min-interval-seconds: ${ROUTES_OFF_ROUTE_MIN_INTERVAL_SECONDS:8} # earliest reroute after leaving the road
    max-age-seconds: ${ROUTES_MAX_AGE_SECONDS:60}                            # cached route reused up to here if the worker barely moved
    reuse-radius-meters: ${ROUTES_REUSE_RADIUS_METERS:60}
    location-stale-seconds: ${ROUTES_LOCATION_STALE_SECONDS:120}             # worker GPS older than this is rejected
    error-backoff-seconds: ${ROUTES_ERROR_BACKOFF_SECONDS:20}                # negative cache after provider failure
  jwt:
    secret: ${JWT_SECRET}
  security:
    # Tracking / arrival / PIN endpoints accept only identities from a VERIFIED JWT (not the legacy bare-UUID /
    # X-User-Id fallback). Set STRICT_JWT_TRACKING=false only as an emergency rollback.
    strict-jwt-tracking: ${STRICT_JWT_TRACKING:true}
  arrival:
    auto-detect:
      enabled: ${ARRIVAL_AUTO_DETECT_ENABLED:true}          # geofence moves ON_THE_WAY -> ARRIVED automatically
    radius-meters: ${ARRIVAL_RADIUS_METERS:75}
    nearby-radius-meters: ${ARRIVAL_NEARBY_RADIUS_METERS:500}
    max-accuracy-meters: ${ARRIVAL_MAX_ACCURACY_METERS:40}  # poorer fixes are ignored by the geofence
    required-fixes: ${ARRIVAL_REQUIRED_FIXES:3}             # consecutive qualifying fixes
    min-dwell-seconds: ${ARRIVAL_MIN_DWELL_SECONDS:6}
    max-speed-mps: ${ARRIVAL_MAX_SPEED_MPS:4.0}             # faster = driving past, not arriving
    require-proximity: ${ARRIVAL_REQUIRE_PROXIMITY:true}    # manual "Arrived" needs a fresh fix near the address
    manual-radius-meters: ${ARRIVAL_MANUAL_RADIUS_METERS:200}
    max-fix-age-seconds: ${ARRIVAL_MAX_FIX_AGE_SECONDS:120}
  tracking:
    live-window-seconds: ${TRACKING_LIVE_WINDOW_SECONDS:30}  # never "live" with an older fix
    history:
      enabled: ${TRACKING_HISTORY_ENABLED:true}
      min-interval-seconds: ${TRACKING_HISTORY_MIN_INTERVAL_SECONDS:15}
      min-distance-meters: ${TRACKING_HISTORY_MIN_DISTANCE_METERS:30}
      retention-days: ${TRACKING_HISTORY_RETENTION_DAYS:30}
  kafka:
    topics:
      booking-events: ${KAFKA_TOPIC_BOOKING_EVENTS:firstdoor.booking.events.v1}
      booking-events-dlt: ${KAFKA_TOPIC_BOOKING_EVENTS_DLT:firstdoor.booking.events.DLT}
      partitions: ${KAFKA_TOPIC_PARTITIONS:3}
      replication-factor: ${KAFKA_TOPIC_REPLICATION_FACTOR:1}
    outbox:
      enabled: ${KAFKA_OUTBOX_ENABLED:false}
      poll-interval-ms: 500
      batch-size: 50
      max-attempts: 5
      initial-backoff-seconds: 2
      max-backoff-seconds: 300
      publish-timeout-seconds: 5
      cleanup-enabled: true
      cleanup-cron: "0 0 3 * * ?"
      retention-days: 7

logging:
  level:
    root: INFO
    com.homeease.backend: DEBUG
    org.hibernate.SQL: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

