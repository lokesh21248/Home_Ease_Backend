server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: homeease-backend

  jackson:
    serialization:
      fail-on-empty-beans: false


  datasource:
    url: jdbc:postgresql://${DB_HOST:aws-0-ap-south-1.pooler.supabase.com}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require&stringtype=unspecified
    username: ${DB_USER:postgres.gheiuyygjssqatziviix}
    password: ${DB_PASS:HomeEase@Supa2026#Secure!}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50


  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration/postgresql

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: RECORD
      auto-startup: ${KAFKA_LISTENER_AUTO_STARTUP:true}

# Supabase Storage (S3-compatible) Configuration
supabase:
  storage:
    endpoint: ${SUPABASE_STORAGE_ENDPOINT:https://gheiuyygjssqatziviix.storage.supabase.co/storage/v1/s3}
    region: ${SUPABASE_REGION:ap-south-1}
    access-key: ${SUPABASE_S3_ACCESS_KEY:your-access-key}
    secret-key: ${SUPABASE_S3_SECRET_KEY:your-secret-key}
    public-url: ${SUPABASE_PUBLIC_URL:https://gheiuyygjssqatziviix.supabase.co/storage/v1/object/public}
    buckets:
      services: homeease-services
      sub-services: homeease-sub-services
      banners: homeease-banners
      worker-kyc: homeease-worker-kyc
      worker-profile: homeease-worker-profile

# App Configuration
homeease:
  firebase:
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:classpath:firebase-service-account.json}
  dispatch:
    radius-meters: 5000 # 5 km matching radius
    response-timeout-seconds: 180 # 3 minutes timeout for candidate acceptance
  billing:
    platform-commission-percent: 2.00 # 2% platform commission
  worker:
    auto-verify: ${AUTO_VERIFY_WORKERS:false} # Workers require admin approval via /admin/workers/{id}/verify-kyc
  google:
    maps:
      api-key: ${GOOGLE_MAPS_API_KEY:}
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  kafka:
    topics:
      booking-events: ${KAFKA_TOPIC_BOOKING_EVENTS:firstdoor.booking.events.v1}
      booking-events-dlt: ${KAFKA_TOPIC_BOOKING_EVENTS_DLT:firstdoor.booking.events.DLT}
      partitions: ${KAFKA_TOPIC_PARTITIONS:3}
      replication-factor: ${KAFKA_TOPIC_REPLICATION_FACTOR:1}
    outbox:
      enabled: ${KAFKA_OUTBOX_ENABLED:true}
      poll-interval-ms: 500
      batch-size: 50
      max-attempts: 5
      initial-backoff-seconds: 2
      max-backoff-seconds: 300
      publish-timeout-seconds: 5
      cleanup-enabled: true
      cleanup-cron: "0 0 3 * * ?"
      retention-days: 7

logging:
  level:
    root: INFO
    com.homeease.backend: DEBUG
    org.hibernate.SQL: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

