# ==============================================================================
# HOME EASE – Single-EC2 Production Application Configuration
# File: application-prod.yml  (homeease-tracking-service)
#
# ENVIRONMENT VARIABLES required on the backend EC2:
#   REDIS_HOST          = 127.0.0.1    (co-located Redis, localhost only)
#   REDIS_PORT          = 6379
#   REDIS_PASSWORD      = <secret>     # Set in /etc/homeease/app.env
#   JWT_SECRET          = <secret>
#   GOOGLE_MAPS_API_KEY = <key>
# ==============================================================================

server:
  port: 8082

spring:
  application:
    name: homeease-tracking-service

  # ── Redis Configuration ────────────────────────────────────────────────────
  # Redis co-located on backend EC2 (127.0.0.1)
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_COMMAND_TIMEOUT:2000ms}
      # Was 1000ms but never applied (the value was read and ignored). Now applied; 5s leaves room
      # for a remote TLS endpoint such as Upstash. Override with REDIS_CONNECT_TIMEOUT.
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:5000ms}
      lettuce:
        pool:
          min-idle: 4
          max-idle: 16
          max-active: 64
          max-wait: 500ms
        shutdown-timeout: 100ms

# ── Management / Actuator ─────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: homeease-tracking
      environment: production

# ── HomeEase Tracking Configuration ──────────────────────────────────────────
homeease:
  worker:
    presence:
      enforce: ${WORKER_PRESENCE_ENFORCE:false}   # same switch as core/dispatch; GEO members count only with a live heartbeat
  jwt:
    secret: ${JWT_SECRET:}

  google:
    maps:
      api-key: ${GOOGLE_MAPS_API_KEY:}

  tracking:
    rate-limit:
      # 60-second sliding window; max 30 updates per worker per minute
      # (1 update/5s = 12 expected; 30 permits reconnect burst)
      window-seconds: ${TRACKING_RATE_LIMIT_WINDOW:60}
      max-updates:    ${TRACKING_RATE_LIMIT_MAX:30}
      # Worker must move at least 15m to bypass rate limit check
      movement-threshold-meters: ${TRACKING_MOVEMENT_THRESHOLD:15.0}

    # Reject GPS fixes with accuracy worse than 50 metres (towers, indoor GPS)
    max-accuracy-meters: ${TRACKING_MAX_ACCURACY_METERS:50.0}

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level:
    root: WARN
    com.homeease.tracking: INFO
  file:
    name: /var/log/homeease/tracking-service.log
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 7

