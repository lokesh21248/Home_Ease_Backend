server:
  port: 8082

spring:
  application:
    name: homeease-tracking-service

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # REDIS_URL (rediss://default:<password>@host:6379) is mapped to spring.data.redis.url by
      # RedisUrlEnvironmentPostProcessor and overrides host/port/password; rediss:// enables TLS.
      timeout: ${REDIS_COMMAND_TIMEOUT:2000ms}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:5000ms}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized

homeease:
  worker:
    presence:
      enforce: ${WORKER_PRESENCE_ENFORCE:false}   # same switch as core/dispatch; GEO members count only with a live heartbeat
  jwt:
    secret: ${JWT_SECRET}
  google:
    maps:
      api-key: ${GOOGLE_MAPS_API_KEY:}
  tracking:
    rate-limit:
      window-seconds: ${TRACKING_RATE_LIMIT_WINDOW:60}
      max-updates: ${TRACKING_RATE_LIMIT_MAX:30}
      movement-threshold-meters: ${TRACKING_MOVEMENT_THRESHOLD:15.0}
    # Maximum GPS accuracy (HDOP) in metres. Updates with worse accuracy are rejected.
    max-accuracy-meters: ${TRACKING_MAX_ACCURACY_METERS:50.0}
