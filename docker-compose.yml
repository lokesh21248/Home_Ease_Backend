version: '3.8'

services:
  # In-memory Redis Cache for geolocation & live tracking
  redis:
    image: redis:7-alpine
    container_name: homeease-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # HomeEase Core Backend
  backend:
    build: .
    container_name: homeease-backend
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy

