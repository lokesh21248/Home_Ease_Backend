server:
  port: 8083

spring:
  application:
    name: homeease-notification-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:homeease_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

homeease:
  firebase:
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:classpath:firebase-service-account.json}
